<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Homepage</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Asul:wght@400;700&family=Bona+Nova+SC:ital,wght@0,400;0,700;1,400&family=Chiron+Sung+HK:ital,wght@0,200..900;1,200..900&display=swap');
            body {
                font-family: Bona Nova SC, serif;
            }

            p, h2 {
                font-family: Asul, sans-serif;
            }

            article {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                height: 100%;
                width: 80vw;
                margin: 0 10vw;
            }

            article > p {
                border: 20px;
                border-radius: 20px;
                font-family: Chiron Sung HK, sans-serif;
            }

            p > a {
                display: inline-block;
                padding: 5px 10px;
                background-color: #C28A6E;
                color: white;
                text-decoration: none;
                border-radius: 8px;
                font-weight: bold;
                transition: 0.3s;
            }

            p > a:hover {
                background-color: #8AA29F;
            }

            a, a:visited {
                color: #191d32;
                text-decoration: none;
            }

            a:visited:hover, a:hover {
                color: #282f44;
            }
        </style>
    </head>
    <body>
        <article>
            <h1>Welcome to Katie's Personal Website!</h1>
            <br/>
            <sub><b>Have a Good Day!</b></sub>
            <br/>
            <p><a href="zhHome.html">中文首頁</a>  <a href="intro.html">About Me</a>  <a href="interest.html">Interest</a></p>
        </article>
    </body>
</html>
