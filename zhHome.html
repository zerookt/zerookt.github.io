<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>首頁</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:ital,wght@0,200..900;1,200..900&display=swap');

            body {
                font-family: Chiron Sung HK, serif;;
            }

            p, h2 {
                font-family: Chiron Sung HK, sans-serif;;
            }

            article {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                height: 100%;
                width: 80vw;
                margin: 0 10vw;
            }

            a, a:visited {
                color: #191d32;
                text-decoration: none;
            }

            a:visited:hover, a:hover {
                color: #282f44;
            }

            article > p {
                border: 20px;
                border-radius: 20px;
            }

            p > a {
                display: inline-block;
                padding: 5px 10px;
                background-color: #C28A6E;
                color: white;
                text-decoration: none;
                border-radius: 8px;
                font-weight: bold;
                transition: 0.3s;
            }

            p > a:hover {
                background-color: #8AA29F;
            }
        </style>
    </head>
    <body>
        <article>
            <h1>歡迎來到林怡瑄的個人網頁！</h1>
            <br/>
            <sub><b>祝大家天天開心~</b></sub>
            <br/>

        </article>
    </body>
</html>
